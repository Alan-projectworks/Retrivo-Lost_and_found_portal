<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications Inbox – RETRIVO.</title>
  <link rel="stylesheet" href="/css/variables.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/components.css">
  <link rel="stylesheet" href="/css/pages.css">
</head>
<body style="background-color: var(--color-ivory);">

  <!-- Navbar -->
  <header class="navbar">
    <div class="container nav-container">
      <div class="nav-left-group">
        <a href="/" class="brand-logo">
          <div class="brand-symbol">
            <img src="/img/retrivo-logo.svg" alt="Retrivo Lost & Found Logo" width="40" height="40">
          </div>
          <div class="brand-text">
            <div class="brand-name">RETRIVO<span>.</span></div>
            <div class="brand-sub">LPU CAMPUS RECOVERY</div>
          </div>
        </a>
        <nav>
          <ul class="nav-links">
            <li><a href="/" class="nav-link">Home</a></li>
            <li><a href="/browse.html" class="nav-link">Browse Items</a></li>
            <li><a href="/report-lost.html" class="nav-link">Report Lost</a></li>
            <li><a href="/report-found.html" class="nav-link">Report Found</a></li>
            <li><a href="/dashboard.html" class="nav-link">Dashboard</a></li>
            <li><a href="/qr-campus.html" class="nav-link">Campus QR</a></li>
          </ul>
        </nav>
      </div>
      <div class="nav-actions" id="nav-auth-container"></div>
      <button class="mobile-toggle-btn" id="mobile-toggle-btn">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
    </div>
  </header>

  <main class="main-content" style="padding: 40px 0 80px 0;">
    <div class="container" style="max-width: 800px;">
      
      <div style="display: flex; justify-content: space-between; align-items: flex-end; flex-wrap: wrap; gap: 16px; margin-bottom: 24px;">
        <div>
          <div class="meta-tag">IN-APP NOTIFICATION HUB</div>
          <h1 style="color: var(--color-forest); font-size: 2.2rem; margin-top: 4px;">Recovery Alerts & Updates</h1>
          <p style="color: var(--color-charcoal-muted); font-size: 0.95rem;">
            Real-time updates regarding your reports, claim decisions, and smart match discoveries.
          </p>
        </div>

        <button type="button" onclick="markAllRead()" class="btn btn-outline btn-sm">
          ✓ Mark All as Read
        </button>
      </div>

      <div style="background-color: var(--color-white); border: 1px solid rgba(20,45,38,0.15); border-radius: var(--radius-xs); overflow: hidden;" id="notif-list-card">
        <div id="notif-list">
          <div style="padding: 40px; text-align: center; color: var(--color-charcoal-muted);">
            Loading notifications...
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/main.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      const user = await guardRoute();
      if (!user) return;
      loadNotifications();
    });

    const loadNotifications = async () => {
      const res = await API.get('/api/notifications');
      const container = document.getElementById('notif-list');

      if (res.success && res.notifications && res.notifications.length > 0) {
        container.innerHTML = res.notifications.map(n => `
          <div style="padding: 20px 24px; border-bottom: 1px solid rgba(20,45,38,0.08); background-color: ${n.is_read ? 'var(--color-white)' : 'var(--color-ivory)'}; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px;">
            <div style="flex: 1;">
              <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 6px;">
                ${!n.is_read ? '<span style="width: 8px; height: 8px; border-radius: 50%; background-color: var(--color-orange); display: inline-block;"></span>' : ''}
                <span style="font-family: var(--font-heading); font-weight: 700; color: var(--color-forest); font-size: 1.05rem;">${n.title}</span>
              </div>
              <p style="font-size: 0.95rem; color: var(--color-charcoal); line-height: 1.5; margin-bottom: 8px;">
                ${n.message}
              </p>
              <div style="font-size: 0.8rem; color: var(--color-sage-dark);">
                ${formatRelativeTime(n.created_at)}
              </div>
            </div>

            <div style="display: flex; align-items: center; gap: 10px;">
              ${n.link ? `<a href="${n.link}" class="btn btn-forest btn-sm">Inspect →</a>` : ''}
              ${!n.is_read ? `<button onclick="markSingleRead(${n.id})" class="btn btn-ghost btn-sm" title="Mark as read">✓</button>` : ''}
            </div>
          </div>
        `).join('');
      } else {
        container.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔔</div>
            <div class="empty-title">Inbox is clear</div>
            <div class="empty-desc">You have no new alerts. Any claim updates or matching items will appear here.</div>
          </div>
        `;
      }
    };

    const markSingleRead = async (id) => {
      await API.put(`/api/notifications/${id}/read`);
      loadNotifications();
      updateNotificationBadge();
    };

    const markAllRead = async () => {
      await API.put('/api/notifications/mark-all-read');
      showToast('All notifications marked as read.', 'info');
      loadNotifications();
      updateNotificationBadge();
    };
  </script>
</body>
</html>
