<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#F5F2E9"/>
  <!-- Shadow -->
  <ellipse cx="300" cy="315" rx="85" ry="16" fill="#252925" opacity="0.12"/>
  <!-- Earbuds Case -->
  <rect x="210" y="150" width="180" height="150" rx="44" fill="#252925" stroke="#142D26" stroke-width="2"/>
  <!-- Case Lid seam -->
  <line x1="210" y1="215" x2="390" y2="215" stroke="#142D26" stroke-width="3"/>
  <rect x="282" y="210" width="36" height="10" rx="5" fill="#142D26"/>
  <!-- LED battery indicator -->
  <circle cx="300" cy="245" r="3.5" fill="#A8B7A0"/>
  <!-- Logo -->
  <text x="300" y="195" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="16" fill="#F07845" text-anchor="middle" letter-spacing="2">boAt</text>
  <!-- Earbud 1 (L) -->
  <g transform="translate(140, 160) rotate(-15)">
    <rect x="0" y="0" width="22" height="60" rx="11" fill="#252925" stroke="#142D26" stroke-width="1.5"/>
    <ellipse cx="11" cy="12" rx="18" ry="14" fill="#252925"/>
    <ellipse cx="23" cy="12" rx="9" ry="11" fill="#A8B7A0"/>
  </g>
  <!-- Earbud 2 (R) -->
  <g transform="translate(435, 145) rotate(15)">
    <rect x="0" y="0" width="22" height="60" rx="11" fill="#252925" stroke="#142D26" stroke-width="1.5"/>
    <ellipse cx="11" cy="12" rx="18" ry="14" fill="#252925"/>
    <ellipse cx="-1" cy="12" rx="9" ry="11" fill="#252925"/>
  </g>
</svg>
