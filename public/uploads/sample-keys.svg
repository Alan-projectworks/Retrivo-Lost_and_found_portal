<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#F5F2E9"/>
  <!-- Shadow -->
  <ellipse cx="320" cy="300" rx="90" ry="16" fill="#252925" opacity="0.12"/>
  <!-- Key Ring -->
  <circle cx="250" cy="180" r="38" fill="none" stroke="#A8B7A0" stroke-width="8"/>
  <circle cx="250" cy="180" r="38" fill="none" stroke="#FFFFFF" stroke-width="4"/>
  <!-- LPU Red Rubber Tag -->
  <g transform="translate(140, 190) rotate(10)">
    <rect x="0" y="0" width="90" height="40" rx="8" fill="#D32F2F" stroke="#9A0007" stroke-width="2"/>
    <circle cx="12" cy="20" r="4" fill="#FFFFFF"/>
    <text x="50" y="24" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle">LPU BH-7</text>
  </g>
  <!-- Key 1 -->
  <g transform="translate(265, 195) rotate(35)">
    <!-- Bow -->
    <circle cx="20" cy="20" r="18" fill="none" stroke="#C2A649" stroke-width="7"/>
    <circle cx="20" cy="20" r="18" fill="none" stroke="#E6CA65" stroke-width="4"/>
    <!-- Blade -->
    <rect x="36" y="16" width="90" height="8" fill="#E6CA65" stroke="#C2A649" stroke-width="1"/>
    <!-- Bitting -->
    <path d="M 90 24 L 95 30 L 100 24 L 105 28 L 110 24 L 115 32 L 120 24 L 126 24 L 126 16 L 36 16" fill="#E6CA65" stroke="#C2A649" stroke-width="1"/>
  </g>
  <!-- Key 2 -->
  <g transform="translate(255, 205) rotate(55)">
    <circle cx="20" cy="20" r="18" fill="none" stroke="#9E9E9E" stroke-width="7"/>
    <circle cx="20" cy="20" r="18" fill="none" stroke="#E0E0E0" stroke-width="4"/>
    <rect x="36" y="16" width="80" height="8" fill="#E0E0E0" stroke="#9E9E9E" stroke-width="1"/>
    <path d="M 80 24 L 85 28 L 90 24 L 95 30 L 100 24 L 105 29 L 110 24 L 116 24 L 116 16 L 36 16" fill="#E0E0E0" stroke="#9E9E9E" stroke-width="1"/>
  </g>
</svg>
