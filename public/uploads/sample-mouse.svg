  <!-- HP Logo -->
  <circle cx="300" cy="260" r="16" fill="#1B3850"/>
  <text x="300" y="265" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="14" fill="#FFFFFF" text-anchor="middle">hp</text>
