  <ellipse cx="300" cy="330" rx="75" ry="16" fill="#252925" opacity="0.12"/>
  <!-- Mouse Body -->
  <path d="M 230 200 C 230 110, 370 110, 370 200 C 370 290, 350 320, 300 320 C 250 320, 230 290, 230 200 Z" fill="#234E70" stroke="#142D26" stroke-width="2.5"/>
  <!-- Scroll Wheel Slot -->
  <rect x="292" y="118" width="16" height="44" rx="8" fill="#142D26"/>
  <rect x="295" y="124" width="10" height="26" rx="5" fill="#A8B7A0"/>
  <!-- Button Split Line -->
