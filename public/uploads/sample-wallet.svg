<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" fill="#F5F2E9"/>
  <!-- Shadow -->
  <ellipse cx="300" cy="320" rx="110" ry="16" fill="#252925" opacity="0.12"/>
  <!-- Wallet Exterior (Tan leather) -->
  <rect x="180" y="140" width="240" height="160" rx="14" fill="#6A4B35" stroke="#483223" stroke-width="2.5"/>
  <!-- Leather Texture / Stitching -->
  <rect x="188" y="148" width="224" height="144" rx="10" fill="none" stroke="#A88B70" stroke-width="1.5" stroke-dasharray="5,3"/>
  <!-- Spine fold seam -->
  <line x1="300" y1="140" x2="300" y2="300" stroke="#483223" stroke-width="3"/>
  <!-- Interior card slots peeking out -->
  <path d="M 195 180 L 290 180 L 290 280 L 195 280 Z" fill="#583C29" stroke="#483223" stroke-width="1"/>
  <path d="M 195 210 L 290 210 L 290 280 L 195 280 Z" fill="#6A4B35" stroke="#483223" stroke-width="1"/>
  <!-- Metro Card sticking out -->
  <rect x="210" y="160" width="70" height="45" rx="3" fill="#008080" transform="rotate(-5, 245, 180)"/>
  <text x="240" y="180" font-family="'Inter', sans-serif" font-weight="700" font-size="7" fill="#FFFFFF" transform="rotate(-5, 245, 180)">METRO</text>
  <!-- Embossed Brand -->
  <text x="355" y="275" font-family="'Space Grotesk', sans-serif" font-weight="700" font-size="12" fill="#3D291D" text-anchor="middle" letter-spacing="1">WOODLAND</text>
  <!-- Security mask icon -->
  <g transform="translate(370, 155)">
    <circle cx="16" cy="16" r="16" fill="#142D26"/>
    <path d="M 10 16 L 14 20 L 22 12" fill="none" stroke="#A8B7A0" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
